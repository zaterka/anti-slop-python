[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anti-slop-python"
version = "0.3.0"
description = "Opinionated AST rules that reject low-evidence and low-signal Python patterns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["lint", "linter", "ast", "code-quality", "ai-slop", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# anti-slop is intentionally dependency-free: it runs on the standard library only.
dependencies = []

[project.scripts]
anti-slop = "anti_slop.cli:main"

[project.urls]
Homepage = "https://github.com/zaterka/anti-slop-python"

[tool.hatch.build.targets.wheel]
packages = ["anti_slop"]

[tool.hatch.build.targets.sdist]
include = ["anti_slop", "tests", "README.md", "LICENSE", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# This repository lints itself with its own ruleset.
#
# (no-shape-in-symbol-names and no-numbered-symbol-names need no entry: they
# are opt-in rules, disabled by default for every project.)
[tool.anti-slop]
# Deliberately sloppy sample code, kept so CI can assert the action annotates
# real findings. Linting it would be linting the test data.
ignore = ["tests/fixtures/**"]

# This codebase's core mechanism *is* AST node-type dispatch (isinstance
# against ast.* classes). The rule targets narrowing untyped runtime values,
# which never occurs here: every ast node is a concrete, statically known
# class. Off for the implementation; still enforced on the tests.
[tool.anti-slop.rules."anti-slop/no-runtime-isinstance"]
exclude = ["anti_slop/**"]

# This project *is* a console tool: stdout via print is its output channel,
# not a debug artifact. Scoped to the two files that own that channel rather
# than switched off everywhere.
[tool.anti-slop.rules."anti-slop/no-debug-prints"]
exclude = ["anti_slop/cli.py", "skills/install-anti-slop/scripts/install.py"]
