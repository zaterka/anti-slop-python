[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anti-slop-python"
version = "0.1.0"
description = "Opinionated AST rules that reject low-evidence and low-signal Python patterns."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lint", "linter", "ast", "code-quality", "ai-slop", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# anti-slop is intentionally dependency-free: it runs on the standard library only.
dependencies = []

[project.scripts]
anti-slop = "anti_slop.cli:main"

[project.urls]
Homepage = "https://github.com/pedro.zaterka/anti-slop-python"

[tool.hatch.build.targets.wheel]
packages = ["anti_slop"]

[tool.hatch.build.targets.sdist]
include = ["anti_slop", "tests", "README.md", "LICENSE", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# This repository lints itself with its own ruleset. The two disabled rules
# are the ones whose very purpose conflicts with being a linter:
#
# - no-runtime-isinstance: this codebase's core mechanism *is* AST node-type
#   dispatch (isinstance against ast.* classes). The rule targets narrowing
#   untyped runtime values, which never occurs here: every ast node is a
#   concrete, statically known class.
#
# - no-shape-in-symbol-names: the rule's own module, class name, registry
#   entry, and test are named after the word it polices.
[tool.anti-slop]

[tool.anti-slop.rules."anti-slop/no-runtime-isinstance"]
enabled = false

[tool.anti-slop.rules."anti-slop/no-shape-in-symbol-names"]
enabled = false
